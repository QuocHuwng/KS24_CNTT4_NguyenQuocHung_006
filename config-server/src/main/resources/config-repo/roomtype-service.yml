server:
  port: 8081

spring:
  application:
    name: roomtype-service

  datasource:
    url: jdbc:mysql://localhost:3306/roomtype_db
    username: root
    password: 123456

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true