server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: roomtype
              uri: lb://roomtype-service
              predicates:
                - Path=/api/roomtypes/**

            - id: room
              uri: lb://room-service
              predicates:
                - Path=/api/rooms/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka