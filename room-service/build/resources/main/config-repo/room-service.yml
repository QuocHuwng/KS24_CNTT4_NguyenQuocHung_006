server:
  port: 8082

spring:
  application:
    name: room-service

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/room_db
    username: root
    password: 123456

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true